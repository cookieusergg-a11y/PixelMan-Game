// ============================================================
//  ГЕНЕРАЦИЯ ID
// ============================================================
function generateUserId() {
    return 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
}

// ============================================================
//  ЗАГРУЗКА / СОХРАНЕНИЕ (ИСПРАВЛЕНО)
// ============================================================
function loadGame() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
        try {
            const parsed = JSON.parse(raw);
            if (parsed.userId) gameData.userId = parsed.userId;
            if (parsed.maxLevel !== undefined) gameData.maxLevel = parsed.maxLevel;
            if (parsed.coins !== undefined) gameData.coins = parsed.coins;
            if (parsed.ownedSkins) gameData.ownedSkins = parsed.ownedSkins;
            if (parsed.activeSkin !== undefined) gameData.activeSkin = parsed.activeSkin;
            if (parsed.completedLevels) gameData.completedLevels = parsed.completedLevels;
            if (!gameData.ownedSkins.includes(0)) gameData.ownedSkins.push(0);
        } catch(e) {}
    }
    if (!gameData.userId) {
        gameData.userId = generateUserId();
        saveGame(); // <-- СОХРАНЯЕМ СРАЗУ, ЧТОБЫ ID НЕ ТЕРЯЛСЯ
    }
    if (!gameData.completedLevels) gameData.completedLevels = [];
}

function saveGame() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(gameData));
}

// ============================================================
//  FIREBASE – СИНХРОНИЗАЦИЯ БАЛАНСА
// ============================================================
function syncCoinsToFirebase() {
    if (!gameData.userId) return;
    db.ref('users/' + gameData.userId + '/coins').set(gameData.coins)
        .catch(err => console.warn('Firebase write error:', err));
}

function loadCoinsFromFirebase() {
    if (!gameData.userId) return;
    db.ref('users/' + gameData.userId + '/coins').once('value')
        .then(snapshot => {
            const val = snapshot.val();
            if (val !== null && val !== undefined) {
                gameData.coins = val;
                saveGame();
                updateUI();
                setSyncStatus(true);
            } else {
                syncCoinsToFirebase();
                setSyncStatus(true);
            }
        })
        .catch(err => {
            console.warn('Firebase read error:', err);
            setSyncStatus(false);
        });
}

function setSyncStatus(ok) {
    if (syncStatus) {
        syncStatus.textContent = ok ? '● синхр.' : '⚠ офлайн';
        syncStatus.style.color = ok ? '#8f8' : '#f88';
    }
}

// ============================================================
//  ОБНОВЛЕНИЕ UI
// ============================================================
function updateUI() {
    if (userIdDisplay) userIdDisplay.textContent = gameData.userId;
    if (coinDisplay) coinDisplay.textContent = gameData.coins;
    if (document.getElementById('userCoins')) document.getElementById('userCoins').textContent = gameData.coins;
    buildMenu();
}

// ============================================================
//  МЕНЮ
// ============================================================
function buildMenu() {
    levelGrid.innerHTML = '';
    for (let i = 1; i <= TOTAL_LEVELS; i++) {
        const btn = document.createElement('button');
        btn.className = 'level-btn';
        const unlocked = i <= gameData.maxLevel;
        const completed = gameData.completedLevels.includes(i);
        if (unlocked) {
            btn.classList.add('unlocked');
            if (completed) btn.classList.add('completed');
            btn.textContent = i + (completed ? ' ✓' : '');
            btn.addEventListener('click', () => startLevel(i-1));
        } else {
            btn.classList.add('locked');
            btn.textContent = i + ' 🔒';
        }
        levelGrid.appendChild(btn);
    }
    if (coinDisplay) coinDisplay.textContent = gameData.coins;
    if (document.getElementById('userCoins')) document.getElementById('userCoins').textContent = gameData.coins;
}

function renderShop() {
    const grid = document.getElementById('skinGrid');
    grid.innerHTML = '';
    SKINS.forEach(skin => {
        const card = document.createElement('div');
        card.className = 'skin-card';
        if (gameData.activeSkin === skin.id) card.classList.add('active');

        const preview = document.createElement('div');
        preview.className = 'color-preview';
        preview.style.background = skin.color;
        card.appendChild(preview);

        const name = document.createElement('div');
        name.className = 'skin-name';
        name.textContent = skin.name;
        card.appendChild(name);

        const price = document.createElement('div');
        price.className = 'skin-price';
        price.textContent = skin.price === 0 ? 'Бесплатно' : skin.price + ' 🪙';
        card.appendChild(price);

        const btn = document.createElement('button');
        const owned = gameData.ownedSkins.includes(skin.id);
        const isActive = gameData.activeSkin === skin.id;

        if (isActive) {
            btn.textContent = '✅ Активен';
            btn.disabled = true;
            btn.className = 'active-btn';
        } else if (owned) {
            btn.textContent = 'Выбрать';
            btn.className = 'select';
            btn.addEventListener('click', () => {
                gameData.activeSkin = skin.id;
                saveGame();
                renderShop();
                updateUI();
            });
        } else {
            const canBuy = gameData.coins >= skin.price;
            btn.textContent = 'Купить';
            btn.className = 'buy';
            btn.disabled = !canBuy;
            btn.addEventListener('click', () => {
                if (gameData.coins >= skin.price) {
                    gameData.coins -= skin.price;
                    gameData.ownedSkins.push(skin.id);
                    saveGame();
                    syncCoinsToFirebase();
                    renderShop();
                    updateUI();
                    showToast('Куплен скин ' + skin.name);
                }
            });
        }
        card.appendChild(btn);
        grid.appendChild(card);
    });
}

// ============================================================
//  ПЕРЕДАЧА МОНЕТ
// ============================================================
function transferCoins(targetId, amount) {
    if (!targetId || targetId.trim() === '') {
        showToast('Введите ID получателя');
        return;
    }
    if (targetId === gameData.userId) {
        showToast('Нельзя передать самому себе');
        return;
    }
    amount = parseInt(amount);
    if (isNaN(amount) || amount <= 0) {
        showToast('Введите положительное число');
        return;
    }
    if (amount > gameData.coins) {
        showToast('Недостаточно монет');
        return;
    }

    db.ref('users/' + targetId + '/coins').once('value')
        .then(snapshot => {
            const targetCoins = snapshot.val();
            if (targetCoins === null || targetCoins === undefined) {
                showToast('Игрок с таким ID не найден');
                return;
            }
            gameData.coins -= amount;
            saveGame();
            syncCoinsToFirebase();
            const newTargetCoins = targetCoins + amount;
            db.ref('users/' + targetId + '/coins').set(newTargetCoins)
                .then(() => {
                    showToast('Передача выполнена! Отправлено ' + amount + ' монет');
                    updateUI();
                    document.getElementById('targetIdInput').value = '';
                    document.getElementById('amountInput').value = '';
                    transferModal.style.display = 'none';
                })
                .catch(err => {
                    gameData.coins += amount;
                    saveGame();
                    syncCoinsToFirebase();
                    showToast('Ошибка передачи, попробуйте позже');
                    console.error(err);
                });
        })
        .catch(err => {
            showToast('Ошибка проверки получателя');
            console.error(err);
        });
}

function startAfk() {
    if (afkActive) return;
    afkActive = true;
    afkBtnElement.textContent = '⏳ AFK фарм ВКЛ';
    afkBtnElement.classList.add('active');
    afkCountdown = 120;
    updateAfkTimerDisplay();
    if (afkInterval) clearInterval(afkInterval);
    afkInterval = setInterval(() => {
        afkCountdown--;
        updateAfkTimerDisplay();
        if (afkCountdown <= 0) {
            const reward = 5;
            gameData.coins += reward;
            saveGame();
            syncCoinsToFirebase();
            updateUI();
            showToast('+' + reward + ' 🪙 (AFK-фарм)');
            afkCountdown = 120;
            updateAfkTimerDisplay();
        }
    }, 1000);
}

function stopAfk() {
    if (!afkActive) return;
    afkActive = false;
    afkBtnElement.textContent = '⏳ AFK-фарм (5🪙 / 2мин)';
    afkBtnElement.classList.remove('active');
    if (afkInterval) {
        clearInterval(afkInterval);
        afkInterval = null;
    }
    afkCountdown = 120;
    afkTimerElement.textContent = '0с';
}

function toggleAfk() {
    if (afkActive) stopAfk();
    else startAfk();
}

function updateAfkTimerDisplay() {
    afkTimerElement.textContent = afkCountdown + 'с';
}

// ============================================================
//  ИГРОВАЯ ЛОГИКА
// ============================================================
function startLevel(index) {
    if (index < 0 || index >= TOTAL_LEVELS) return;
    currentLevel = index;
    const level = LEVELS[index];
    platforms = level.platforms.map(p => ({...p}));
    doorX = level.doorX;
    player.x = level.playerX; player.y = level.playerY;
    player.vx = 0; player.vy = 0; player.onGround = false;
    player.walkTime = 0;
    coins = level.coins.map(c => ({x:c.x, y:c.y, radius:10, collected:false}));

    gameRunning = true;
    gameOverShown = false;
    menuEl.style.display = 'none';
    gameWrapper.style.display = 'block';
    gameOverEl.style.display = 'none';
    document.getElementById('backToMenu').style.display = 'block';
    keys = {left:false, right:false, jump:false};
    if (!window._loopStarted) { window._loopStarted = true; requestAnimationFrame(gameLoop); }
    canvas.focus();
}

function update() {
    if (!gameRunning || gameOverShown) return;

    if (keys.left) player.vx = -MOVE_SPEED;
    else if (keys.right) player.vx = MOVE_SPEED;
    else player.vx *= 0.85;

    if (keys.jump && player.onGround) {
        player.vy = JUMP_FORCE;
        player.onGround = false;
    }

    player.vy += GRAVITY;
    if (player.vy > 15) player.vy = 15;

    if (player.onGround && Math.abs(player.vx) > 0.5) {
        player.walkTime += 0.15;
    } else if (player.onGround) {
        player.walkTime = 0;
    }

    player.x += player.vx;
    for (let p of platforms) {
        if (player.x < p.x + p.w && player.x + PLAYER_W > p.x &&
            player.y < p.y + p.h && player.y + PLAYER_H > p.y) {
            if (player.vx > 0) player.x = p.x - PLAYER_W;
            else if (player.vx < 0) player.x = p.x + p.w;
            player.vx = 0;
        }
    }

    player.y += player.vy;
    player.onGround = false;
    for (let p of platforms) {
        if (player.x < p.x + p.w && player.x + PLAYER_W > p.x &&
            player.y < p.y + p.h && player.y + PLAYER_H > p.y) {
            if (player.vy > 0) {
                player.y = p.y - PLAYER_H;
                player.vy = 0;
                player.onGround = true;
            } else if (player.vy < 0) {
                player.y = p.y + p.h;
                player.vy = 0;
            }
        }
    }

    for (let c of coins) {
        if (!c.collected) {
            const dx = (player.x + PLAYER_W/2) - c.x;
            const dy = (player.y + PLAYER_H/2) - c.y;
            if (Math.sqrt(dx*dx + dy*dy) < c.radius + 14) {
                c.collected = true;
                const reward = 1;
                gameData.coins += reward;
                saveGame();
                syncCoinsToFirebase();
                updateUI();
                showToast('+1 🪙 (собрано)');
            }
        }
    }

    if (player.y > 600) { restartLevel(); return; }

    if (player.x + PLAYER_W > doorX && player.x < doorX + DOOR_W &&
        player.y + PLAYER_H > 0 && player.y < 500) {
        const levelNum = currentLevel + 1;
        if (!gameData.completedLevels.includes(levelNum)) {
            const reward = COIN_REWARDS[currentLevel];
            gameData.coins += reward;
            gameData.completedLevels.push(levelNum);
            saveGame();
            syncCoinsToFirebase();
            showToast('🎉 Уровень ' + levelNum + ' пройден! +' + reward + ' 🪙');
        } else {
            showToast('✅ Уровень ' + levelNum + ' пройден (повторно)');
        }
        if (levelNum > gameData.maxLevel) gameData.maxLevel = levelNum;
        saveGame();
        if (levelNum >= TOTAL_LEVELS) {
            showGameOver();
        } else {
            startLevel(currentLevel + 1);
        }
        return;
    }
}

function restartLevel() {
    startLevel(currentLevel);
}

// ============================================================
//  ОТРИСОВКА ЗАСТАВКИ
// ============================================================
function drawIntro() {
    ctx.clearRect(0, 0, 800, 500);

    const grad = ctx.createLinearGradient(0, 0, 0, 500);
    grad.addColorStop(0, '#0a0a2a');
    grad.addColorStop(1, '#1a1a3a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 800, 500);

    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 80; i++) {
        const sx = (i * 37) % 800;
        const sy = (i * 53) % 500;
        const size = (i % 3) + 1;
        ctx.globalAlpha = 0.3 + (i % 5) * 0.1;
        ctx.fillRect(sx, sy, size, size);
    }
    ctx.globalAlpha = 1.0;

    if (introBlocks.length === 0) {
        for (let i = 0; i < 8; i++) {
            const x = 100 + i * 120 + Math.random() * 40;
            const y = introBaseY - 20 - Math.random() * 60;
            const w = 50 + Math.random() * 40;
            introBlocks.push({ x, y, w, h:16 });
        }
    }

    for (let b of introBlocks) {
        b.x -= introSpeed;
    }
    introBlocks = introBlocks.filter(b => b.x + b.w > -20);
    const last = introBlocks[introBlocks.length-1];
    if (last && last.x + last.w < 700) {
        const gap = 80 + Math.random() * 120;
        const x = last.x + last.w + gap;
        const y = introBaseY - 20 - Math.random() * 60;
        const w = 50 + Math.random() * 40;
        introBlocks.push({ x, y, w, h:16 });
    } else if (introBlocks.length === 0) {
        introBlocks.push({ x: 800, y: introBaseY - 20, w: 60, h:16 });
    }

    ctx.fillStyle = '#6a7a9a';
    for (let b of introBlocks) {
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#8a9aba';
        ctx.fillRect(b.x+2, b.y-2, b.w-4, 4);
        ctx.fillStyle = '#6a7a9a';
    }

    introJumpTimer += 1/60;
    if (!introJumpActive && introJumpTimer > 1.5 + Math.random() * 1.0) {
        introJumpActive = true;
        introJumpTimer = 0;
        introJumpOffset = -40;
    }
    if (introJumpActive) {
        introJumpOffset += 0.7;
        if (introJumpOffset >= 0) {
            introJumpOffset = 0;
            introJumpActive = false;
            introJumpTimer = 0;
        }
    }

    introWalkTime += 0.15;

    const px = 400 - PLAYER_W/2;
    const py = introBaseY - PLAYER_H + introJumpOffset;

    const skinColor = SKINS.find(s => s.id === gameData.activeSkin) || SKINS[0];
    const clothColor = skinColor.color;
    const headColor = '#f5cba7';
    const legColor = '#e6b88a';

    const headX = px + 6, headY = py, headW = 12, headH = 10;
    const bodyX = px + 2, bodyY = py + 10, bodyW = 20, bodyH = 12;
    const shortsX = px + 2, shortsY = py + 22, shortsW = 20, shortsH = 8;
    const legW = 6, legH = 10;

    ctx.fillStyle = headColor;
    ctx.fillRect(headX, headY, headW, headH);

    ctx.fillStyle = clothColor;
    ctx.fillRect(headX - 2, headY - 4, headW + 4, 6);
    ctx.fillRect(headX - 4, headY - 2, 6, 3);
    ctx.fillRect(headX + headW - 2, headY - 2, 6, 3);
    ctx.fillRect(headX + 2, headY - 6, 8, 3);

    ctx.fillStyle = clothColor;
    ctx.fillRect(bodyX, bodyY, bodyW, bodyH);
    const darken = (col) => {
        let r = parseInt(col.substring(1,3),16);
        let g = parseInt(col.substring(3,5),16);
        let b = parseInt(col.substring(5,7),16);
        r = Math.max(0, r - 30);
        g = Math.max(0, g - 30);
        b = Math.max(0, b - 30);
        return `rgb(${r},${g},${b})`;
    };
    ctx.fillStyle = darken(clothColor);
    ctx.fillRect(shortsX, shortsY, shortsW, shortsH);

    const legYBase = shortsY + shortsH;
    const isJumping = introJumpActive;

    if (isJumping) {
        ctx.fillStyle = legColor;
        ctx.fillRect(px + 4, legYBase, legW, legH);
        ctx.fillRect(px + 14, legYBase - 6, legW, 6);
    } else {
        const phase = Math.sin(introWalkTime);
        const leftOffsetX = 4 + phase * 4;
        const leftOffsetY = (phase > 0) ? -2 : 2;
        ctx.fillStyle = legColor;
        ctx.fillRect(px + leftOffsetX, legYBase + leftOffsetY, legW, legH);
        const rightOffsetX = 14 - phase * 4;
        const rightOffsetY = (phase < 0) ? -2 : 2;
        ctx.fillRect(px + rightOffsetX, legYBase + rightOffsetY, legW, legH);
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 64px "Press Start 2P", cursive';
    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 30;
    ctx.fillText('PixelMan', 400, 160);
    ctx.shadowColor = '#f0f';
    ctx.shadowBlur = 40;
    ctx.fillText('PixelMan', 400, 160);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeText('PixelMan', 400, 160);

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '14px "Press Start 2P", cursive';
    ctx.fillText('Кликни в любую точку', 400, 480);
}

// ============================================================
//  ОТРИСОВКА ИГРЫ
// ============================================================
function draw() {
    ctx.clearRect(0,0,800,500);
    ctx.fillStyle = '#1a1a3a';
    ctx.fillRect(0,0,800,500);

    ctx.fillStyle = '#6a7a9a';
    for (let p of platforms) {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#8a9aba';
        ctx.fillRect(p.x+2, p.y-2, p.w-4, 4);
        ctx.fillStyle = '#6a7a9a';
    }

    for (let c of coins) {
        if (!c.collected) {
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.radius, 0, 2*Math.PI);
            ctx.fillStyle = '#ffd700';
            ctx.fill();
            ctx.shadowColor = '#ffd70088';
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff7aa';
            ctx.beginPath();
            ctx.arc(c.x-3, c.y-4, 3, 0, 2*Math.PI);
            ctx.fill();
        }
    }

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(doorX, 0, DOOR_W, DOOR_H);
    const letters = ['В', 'Ы', 'Х', 'О', 'Д'];
    const centerX = doorX + DOOR_W/2;
    const startY = 120;
    const stepY = 44;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 28px Arial';
    ctx.fillStyle = '#000';
    for (let i = 0; i < letters.length; i++) {
        ctx.fillText(letters[i], centerX, startY + i*stepY);
    }

    const px = player.x;
    const py = player.y;
    const skinColor = SKINS.find(s => s.id === gameData.activeSkin) || SKINS[0];
    const clothColor = skinColor.color;
    const headColor = '#f5cba7';
    const legColor = '#e6b88a';

    const headX = px + 6, headY = py, headW = 12, headH = 10;
    const bodyX = px + 2, bodyY = py + 10, bodyW = 20, bodyH = 12;
    const shortsX = px + 2, shortsY = py + 22, shortsW = 20, shortsH = 8;
    const legW = 6, legH = 10;

    ctx.fillStyle = headColor;
    ctx.fillRect(headX, headY, headW, headH);

    ctx.fillStyle = clothColor;
    ctx.fillRect(headX - 2, headY - 4, headW + 4, 6);
    ctx.fillRect(headX - 4, headY - 2, 6, 3);
    ctx.fillRect(headX + headW - 2, headY - 2, 6, 3);
    ctx.fillRect(headX + 2, headY - 6, 8, 3);

    ctx.fillStyle = clothColor;
    ctx.fillRect(bodyX, bodyY, bodyW, bodyH);
    const darken2 = (col) => {
        let r = parseInt(col.substring(1,3),16);
        let g = parseInt(col.substring(3,5),16);
        let b = parseInt(col.substring(5,7),16);
        r = Math.max(0, r - 30);
        g = Math.max(0, g - 30);
        b = Math.max(0, b - 30);
        return `rgb(${r},${g},${b})`;
    };
    ctx.fillStyle = darken2(clothColor);
    ctx.fillRect(shortsX, shortsY, shortsW, shortsH);

    const legYBase = shortsY + shortsH;
    const isMoving = Math.abs(player.vx) > 0.5 && player.onGround;
    const isJumping = !player.onGround;

    if (isJumping) {
        ctx.fillStyle = legColor;
        ctx.fillRect(px + 4, legYBase, legW, legH);
        ctx.fillRect(px + 14, legYBase - 6, legW, 6);
    } else if (isMoving) {
        const phase = Math.sin(player.walkTime);
        const leftOffsetX = 4 + phase * 4;
        const leftOffsetY = (phase > 0) ? -2 : 2;
        ctx.fillStyle = legColor;
        ctx.fillRect(px + leftOffsetX, legYBase + leftOffsetY, legW, legH);
        const rightOffsetX = 14 - phase * 4;
        const rightOffsetY = (phase < 0) ? -2 : 2;
        ctx.fillRect(px + rightOffsetX, legYBase + rightOffsetY, legW, legH);
    } else {
        ctx.fillStyle = legColor;
        ctx.fillRect(px + 4, legYBase, legW, legH);
        ctx.fillRect(px + 14, legYBase, legW, legH);
    }
}

// ============================================================
//  ГЛАВНЫЙ ЦИКЛ
// ============================================================
function gameLoop() {
    if (introActive) {
        drawIntro();
        requestAnimationFrame(gameLoop);
        return;
    }
    if (!gameRunning && !gameOverShown) {
        requestAnimationFrame(gameLoop);
        return;
    }
    if (gameOverShown) {
        requestAnimationFrame(gameLoop);
        return;
    }
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

    toastEl._timeout = setTimeout(() => toastEl.classList.remove('show'), 2500);
}

// ============================================================
//  КЛАВИШИ
// ============================================================
function handleKeyDown(e) {
    const code = e.code;
    if (code === 'KeyA' || code === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
    if (code === 'KeyD' || code === 'ArrowRight') { keys.right = true; e.preventDefault(); }
    if (code === 'KeyW' || code === 'Space' || code === 'ArrowUp') { keys.jump = true; e.preventDefault(); }
    if (code === 'KeyR') { if (gameRunning) restartLevel(); e.preventDefault(); }
}
function handleKeyUp(e) {
    const code = e.code;
    if (code === 'KeyA' || code === 'ArrowLeft') { keys.left = false; e.preventDefault(); }
    if (code === 'KeyD' || code === 'ArrowRight') { keys.right = false; e.preventDefault(); }
    if (code === 'KeyW' || code === 'Space' || code === 'ArrowUp') { keys.jump = false; e.preventDefault(); }
}
document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);
window.addEventListener('keydown', handleKeyDown);
window.addEventListener('keyup', handleKeyUp);

    shopEl.style.display = 'none';
    transferModal.style.display = 'none';
    document.getElementById('backToMenu').style.display = 'none';

    window._loopStarted = false;
    requestAnimationFrame(gameLoop);
};

function goToMenu() {
    gameRunning = false;
    gameOverShown = false;
    if (afkActive) stopAfk();
    gameWrapper.style.display = 'block';
    gameOverEl.style.display = 'none';
    shopEl.style.display = 'none';
    transferModal.style.display = 'none';
    menuEl.style.display = 'flex';
    document.getElementById('backToMenu').style.display = 'none';
    updateUI();
    keys = {left:false, right:false, jump:false};
    player.x = 0; player.y = 0; player.vx = 0; player.vy = 0;
}

function resetProgress() {
    if (!confirm('Сбросить прогресс уровней?\nМонеты и скины останутся.')) return;
    gameData.maxLevel = 1;
    gameData.completedLevels = [];
    saveGame();
    if (gameRunning || gameOverShown) {
        goToMenu();
    }
    updateUI();
    showToast('Прогресс уровней сброшен!');
}
</script>
</body>
</html>
